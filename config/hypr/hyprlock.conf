# AI slop edition · tokens
# accent #8b5cf6 → fuchsia #d946ef · bg #0a0714 · clock #c4b5fd

general {
  hide_cursor = true
}

background {
  path = ~/.config/images/sunset.png
  blur_passes = 2
  blur_size = 10
  noise = 0.015
  contrast = 0.95
  brightness = 0.85
}

# fake glow (layered translucent shape — hyprlock has no box-shadow)
shape {
  size = 470, 440
  color = rgba(139, 92, 246, 0.10)
  rounding = 36
  border_size = 0
  position = 0, 0
  halign = center
  valign = center
}

# glass card
shape {
  size = 440, 400
  color = rgba(10, 7, 20, 0.72)
  rounding = 24
  border_size = 1
  border_color = rgba(255, 255, 255, 0.08)
  position = 0, 0
  halign = center
  valign = center
}

# mascot glow ring
shape {
  size = 84, 84
  color = rgba(139, 92, 246, 0.35)
  rounding = 42
  border_size = 0
  position = 0, 35
  halign = center
  valign = center
}

image {
  path = ~/.config/images/emotes/cat_popcorn.png
  size = 64
  rounding = -1
  border_size = 2
  border_color = rgba(139, 92, 246, 1.0)
  position = 0, 35
  halign = center
  valign = center
}

label {
  text = $TIME
  font_size = 44
  font_family = FiraCode Nerd Font
  color = rgba(196, 181, 253, 1.0)
  position = 0, 150
  halign = center
  valign = center
  text_align = center
}

label {
  text = NOBODY IS GOING TO YOUR FUNERAL!!!
  font_size = 12
  font_family = FiraCode Nerd Font
  color = rgba(236, 233, 245, 0.55)
  position = 0, 105
  halign = center
  valign = center
  text_align = center
}

label {
  text = type the password duh
  font_size = 14
  font_family = FiraCode Nerd Font
  color = rgba(167, 139, 250, 1.0)
  position = 0, -35
  halign = center
  valign = center
  text_align = center
}

input-field {
  size = 320, 56
  position = 0, -105
  halign = center
  valign = center
  rounding = 28
  inner_color = rgba(10, 7, 20, 0.6)
  outer_color = rgba(139, 92, 246, 0.9)
  fail_color = rgba(204, 34, 34, 1.0)
  fail_text = <i>Wrong, idiot <b>($ATTEMPTS)</b></i>
  placeholder_text = <i>Enter password...</i>
  font_family = FiraCode Nerd Font
  dots_center = true
  fade_on_empty = true
}
